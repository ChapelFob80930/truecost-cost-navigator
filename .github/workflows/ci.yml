name: CI

# Runs on every push to main and every pull request, and is reused by the deploy workflow so nothing is deployed untested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend tests (includes the README architecture check)
        working-directory: backend
        run: python -m pytest -q

      - name: Streamlit app compiles
        run: python -m py_compile frontend/app.py frontend/agents_ui.py frontend/compose_link.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Look for keys, tokens and passwords in tracked files
        run: python scripts/secret_scan.py

  vercel-bundle:
    name: Vercel bundle (clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install ONLY what Vercel installs (api/requirements.txt) into a fresh environment
        run: |
          python -m venv /tmp/vercel-venv
          /tmp/vercel-venv/bin/pip install --upgrade pip
          /tmp/vercel-venv/bin/pip install -r api/requirements.txt

      - name: Import the function as Vercel does, call it, and check data files and size
        run: /tmp/vercel-venv/bin/python scripts/check_vercel_bundle.py
